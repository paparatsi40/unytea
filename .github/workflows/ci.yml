name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs viejos del mismo branch cuando se pushea algo nuevo (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Variables dummy para que comandos como `prisma generate` no fallen en CI.
# El cliente de Prisma se genera del schema, no requiere conexión real a la DB.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  NEXTAUTH_SECRET: "ci-dummy-secret-not-used-in-runtime"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  # Blocking guard for SEC-01. NEXT_PUBLIC_* values are inlined into the client
  # bundle at build time, so a secret stored under such a name is published to
  # every visitor. Dependency-free by design: it runs without `npm ci` so it
  # fails fast and cannot be broken by an install problem.
  secret-scan:
    name: Public env secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Check for secret-shaped NEXT_PUBLIC_* values
        run: node scripts/check-public-env.mjs

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - name: Run vitest
        run: npm test

  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    # The previous TODO that justified continue-on-error was the firstName
    # type error, which has since been fixed. The 40+ test type errors that
    # also slipped in during that window were cleaned up in the same pass.
    # Type errors should now block PRs; if they re-emerge, fix them — don't
    # re-add this flag.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - name: Type-check
        run: npm run type-check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    # Blocking. The "Invalid Options: useEslintrc, extensions" failure that
    # justified continue-on-error is long gone — `npm run lint` exits 0 today.
    #
    # ESLint exits non-zero only on *errors*, so this gates the security rule
    # `unytea/no-bare-server-action` (severity: error — every export of a
    # "use server" module must go through defineAction) while the remaining
    # ~180 warnings stay visible but non-blocking until M16 clears them.
    # Raising --max-warnings to paper over those is explicitly not the plan.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  build:
    name: Next build
    runs-on: ubuntu-latest
    # Blocking. Without this, a build that compiles nowhere but Vercel is only
    # discovered after merge, on the deploy — type-check and lint do not catch
    # what the bundler catches (a bad dynamic import, a client component
    # reaching for a server-only module, a route that fails to prerender).
    #
    # `npx next build`, never `npm run build`: the npm script is
    # `prisma generate && prisma migrate deploy && next build`, and
    # `migrate deploy` would try to run migrations against whatever DATABASE_URL
    # resolves to. CI must never migrate a database, least of all production.
    # `npm ci` already runs `prisma generate` through postinstall, so the client
    # exists by the time the bundler needs its types.
    #
    # The dummy DATABASE_URL at the top of this file points at a port with
    # nothing behind it. That is deliberate and sufficient: pages that query
    # during prerender handle their own failures, so the build completes without
    # a reachable database — verified before this job was added.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npx next build

  format-check:
    name: Prettier format check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - name: Prettier check
        run: npm run format:check
